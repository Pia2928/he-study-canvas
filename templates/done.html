{% extends "base.html" %}
{% block bodyclass %}done-body{% endblock %}
{% block body %}
<main class="page narrow center">
    <h1>{{ t.done_title }}</h1>
    <p class="lead">{{ t.done_text }}</p>
    {% if survey_url %}<a class="btn" id="go" href="{{ survey_url }}">{{ t.done_button }}</a>{% endif %}
</main>
<script>
(function () {
    var framed = false;
    try { framed = window.self !== window.top; } catch (e) { framed = true; }
    var msg = { type: "he_done", pid: {{ pid|tojson }}, cond: {{ condition|tojson }} };
    if (framed) {
        // embedded in a Qualtrics page: tell the page we are finished (it moves on by itself) instead of redirecting
        var go = document.getElementById("go");
        function tell() { try { window.parent.postMessage(msg, "*"); } catch (e) {} }
        if (go) { go.removeAttribute("href"); go.addEventListener("click", tell); }
        tell(); setTimeout(tell, 1500);
    } else {
        {% if survey_url %}setTimeout(function () { location.href = {{ survey_url|tojson }}; }, 4000);{% endif %}
    }
})();
</script>
{% endblock %}
