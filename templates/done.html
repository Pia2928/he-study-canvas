{% extends "base.html" %}
{% block body %}
<main class="page narrow center">
    <h1>{{ t.done_title }}</h1>
    <p class="lead">{{ t.done_text }}</p>
    {% if survey_url %}<a class="btn" href="{{ survey_url }}">{{ t.done_button }}</a>{% endif %}
</main>
{% if survey_url %}<script>setTimeout(function () { location.href = {{ survey_url|tojson }}; }, 4000);</script>{% endif %}
{% endblock %}
